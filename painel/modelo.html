<title>Solvix Social OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+Display:wght@300;400;500&display=swap">
<style>
/* Layout: aplicativo editorial monocromático. Barra lateral fixa com navegação e estado da sincronização;
   área principal com cabeçalho de página e grid de 12 colunas; ficha do post em painel lateral.
   Status sem cor: cada etapa tem um sinal de forma própria (vazio, meio, anel, cheio, losango, visto). */
:root {
  --bg: #050505;
  --bg-2: #0A0A0A;
  --surface: #101010;
  --surface-2: #161616;
  --line: #222222;
  --line-2: #2E2E2E;
  --muted: #6E6E6E;
  --text-2: #A3A3A3;
  --text: #F5F5F3;
  --strong: #FFFFFF;
  --inv-bg: #F5F5F3;
  --inv-fg: #050505;
  --scrim: rgba(0, 0, 0, 0.62);
  --post-dark: #141414;
  --post-light: #F5F5F3;
  --serif: "Noto Serif Display", "Didot", "Bodoni 72", Georgia, "Times New Roman", serif;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --s-1: 0.75rem;
  --s0: 0.9375rem;
  --s1: 1.125rem;
  --s2: 1.5rem;
  --s3: 2.125rem;
  --s4: clamp(2.3rem, 4.6vw, 3.6rem);
  --side: 248px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F5F5F3; --bg-2: #EFEFEC; --surface: #FFFFFF; --surface-2: #FAFAF8; --line: #E3E3E0; --line-2: #D2D2CF;
    --muted: #8A8A87; --text-2: #575755; --text: #0A0A0A; --strong: #000000; --inv-bg: #0A0A0A; --inv-fg: #F5F5F3;
    --scrim: rgba(10, 10, 10, 0.35);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F5F5F3; --bg-2: #EFEFEC; --surface: #FFFFFF; --surface-2: #FAFAF8; --line: #E3E3E0; --line-2: #D2D2CF;
  --muted: #8A8A87; --text-2: #575755; --text: #0A0A0A; --strong: #000000; --inv-bg: #0A0A0A; --inv-fg: #F5F5F3;
  --scrim: rgba(10, 10, 10, 0.35);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #050505; --bg-2: #0A0A0A; --surface: #101010; --surface-2: #161616; --line: #222222; --line-2: #2E2E2E;
  --muted: #6E6E6E; --text-2: #A3A3A3; --text: #F5F5F3; --strong: #FFFFFF; --inv-bg: #F5F5F3; --inv-fg: #050505;
  --scrim: rgba(0, 0, 0, 0.62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: var(--s0); line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 1.5px solid var(--text); outline-offset: 3px; }
.eyebrow { font-size: var(--s-1); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-2); }
.muted { color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; background: var(--bg-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 16px 18px; gap: 22px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.brand img { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 0 0 1px var(--line-2); display: block; }
.brand b { display: block; font-weight: 500; font-size: 0.95rem; letter-spacing: 0.03em; line-height: 1; }
.brand small { display: block; font-size: 0.5625rem; letter-spacing: 0.34em; color: var(--text-2); margin-top: 5px; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: var(--text-2); font-size: 0.9rem; }
.nav a:hover { background: var(--surface); color: var(--text); }
.nav a[aria-current="page"] { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.nav a .k { font-size: 0.6875rem; letter-spacing: 0.06em; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav a .k.on { color: var(--inv-fg); background: var(--inv-bg); border-radius: 999px; padding: 1px 7px; font-weight: 600; }
.side-foot { margin-top: auto; display: grid; gap: 10px; padding: 0 6px; }
.chip-status { display: flex; align-items: flex-start; gap: 9px; font-size: 0.75rem; line-height: 1.4; color: var(--text-2); }
.chip-status i { flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; border: 1px solid var(--text-2); }
.chip-status.ok i { background: var(--text); border-color: var(--text); }
.chip-status b { color: var(--text); font-weight: 500; display: block; }
.ghost-btn { background: none; border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 12px; font-size: var(--s-1); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); cursor: pointer; justify-self: start; }
.ghost-btn:hover { color: var(--text); border-color: var(--muted); }

.main { min-width: 0; }
.page { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 3.6vw, 48px); padding-block: 36px 96px; }
.view[hidden] { display: none !important; }
.page-head { display: grid; gap: 10px; padding-bottom: 28px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
.page-head h1 { font-size: var(--s4); font-weight: 300; line-height: 1.05; max-width: 22ch; }
.page-head p.lede { color: var(--text-2); max-width: 64ch; font-size: var(--s1); }
.head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; }

/* Topo no celular */
.mtop { display: none; }
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mtop { display: block; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
  .mtop .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px 0; }
  .mtop .nav { display: flex; gap: 6px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; }
  .mtop .nav::-webkit-scrollbar { display: none; }
  .mtop .nav a { flex: none; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 0.8125rem; }
  .mtop .nav a[aria-current="page"] { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); box-shadow: none; }
  .mtop .nav a[aria-current="page"] .k { color: var(--inv-fg); }
  .mtop .nav a .k.on { background: var(--inv-fg); color: var(--inv-bg); }
}

/* ---------- Componentes ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.card > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.card > header h2 { font-size: var(--s2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 9px 16px; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: 1px solid transparent; text-decoration: none; white-space: nowrap; }
.btn.primary { background: var(--inv-bg); color: var(--inv-fg); }
.btn.primary:hover { opacity: 0.88; }
.btn.line { border-color: var(--line-2); background: transparent; color: var(--text); }
.btn.line:hover { border-color: var(--text-2); }
.btn.small { padding: 6px 12px; font-size: 0.8125rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 10px; font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
.tag.solid { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* Sinal de status (forma, não cor) */
.sg { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; position: relative; vertical-align: -1px; }
.sg.planejado { border: 1.5px solid var(--muted); }
.sg.producao { border: 1.5px solid var(--text-2); background: linear-gradient(90deg, var(--text-2) 50%, transparent 50%); }
.sg.revisao { background: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--text); }
.sg.aprovado { background: var(--text-2); }
.sg.agendado { background: var(--text); border-radius: 2px; transform: rotate(45deg) scale(0.85); }
.sg.publicado { background: var(--text); }
.sg.publicado::after { content: ""; position: absolute; left: 3.2px; top: 1.6px; width: 2.6px; height: 4.6px; border: solid var(--bg); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
.st { display: inline-flex; align-items: center; gap: 8px; font-size: 0.8125rem; color: var(--text-2); white-space: nowrap; }
.st b { font-weight: 500; color: var(--text); }

/* Mapa do ciclo */
.cycle { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 6px; }
.cell { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--line-2); background: transparent; display: grid; place-items: center; font-size: 0.6875rem; color: var(--text-2); cursor: pointer; position: relative; font-variant-numeric: tabular-nums; padding: 0; }
.cell:hover { border-color: var(--text-2); color: var(--text); }
.cell.producao { background: linear-gradient(90deg, var(--surface-2) 50%, transparent 50%); border-color: var(--text-2); }
.cell.revisao { background: var(--text); color: var(--bg); border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text); }
.cell.aprovado { background: var(--text-2); color: var(--bg); border-color: var(--text-2); }
.cell.agendado { background: var(--text); color: var(--bg); border-color: var(--text); border-radius: 50%; }
.cell.publicado { background: var(--text); color: var(--bg); border-color: var(--text); }
.cell.today { outline: 1.5px dashed var(--text); outline-offset: 3px; }
@media (max-width: 720px) { .cycle { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; }

/* Hoje */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: grid; gap: 20px; min-width: 0; }
@media (max-width: 1100px) { .today-grid { grid-template-columns: minmax(0, 1fr); } }
.todo { display: grid; }
.todo-item { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding-block: 12px; border-top: 1px solid var(--line); }
.todo-item:first-child { border-top: 0; padding-top: 0; }
.todo-item .meta { font-size: 0.75rem; color: var(--text-2); letter-spacing: 0.04em; }
.todo-item .h { font-family: var(--serif); font-size: 1.02rem; line-height: 1.3; }
.todo-item .acts { display: flex; gap: 6px; }
@media (max-width: 520px) { .todo-item { grid-template-columns: 44px minmax(0, 1fr); } .todo-item .acts { grid-column: 1 / -1; } }
.check-item { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding-block: 12px; border-top: 1px solid var(--line); align-items: start; }
.check-item input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--text); cursor: pointer; }
.check-item b { font-weight: 500; display: block; }
.check-item p { color: var(--text-2); font-size: 0.875rem; margin-top: 2px; }
.check-item.done b { text-decoration: line-through; color: var(--text-2); }
.check-item a.inline { font-size: 0.8125rem; color: var(--text-2); }
.week-strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }

.mini-card { display: grid; gap: 8px; text-decoration: none; color: inherit; min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.mini-card .d { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); display: flex; justify-content: space-between; gap: 6px; }
.mini-card .h { font-family: var(--serif); font-size: 0.95rem; line-height: 1.3; }
.mini-card:hover .h { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; counter-reset: f; }
.flow div { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; align-content: start; }
.flow b { font-weight: 500; font-size: 0.875rem; }
.flow span { font-size: 0.75rem; color: var(--text-2); line-height: 1.4; }
.flow em { font-style: normal; font-family: var(--serif); font-size: 1.1rem; color: var(--text-2); }
@media (max-width: 640px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.feed-act { display: grid; }
.feed-act div { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); font-size: 0.875rem; }
.feed-act div:first-child { border-top: 0; padding-top: 0; }
.feed-act time { color: var(--text-2); font-size: 0.75rem; font-variant-numeric: tabular-nums; padding-top: 2px; }
.feed-act button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: inherit; font: inherit; }
.feed-act button:hover { text-decoration: underline; text-underline-offset: 3px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stats div { background: var(--surface); padding: 14px; display: grid; gap: 2px; }
.stats b { font-family: var(--serif); font-weight: 400; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-2); }
.empty { color: var(--text-2); font-size: 0.875rem; border: 1px dashed var(--line-2); border-radius: 10px; padding: 14px; }

/* Miniaturas */
.thumb { position: relative; aspect-ratio: 4 / 5; border-radius: 6px; overflow: hidden; background: var(--post-dark); border: 1px solid var(--line); width: 100%; }
.thumb.reels { aspect-ratio: 9 / 16; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .cv { position: absolute; inset: 0; padding: 7% 8%; display: grid; grid-template-rows: auto 1fr auto; color: #F5F5F3; }
.thumb .cv small { display: flex; align-items: center; gap: 4px; font-size: 0.45rem; letter-spacing: 0.16em; text-transform: uppercase; color: #A3A3A3; }
.thumb .cv small img { position: static; width: auto; height: 9px; }
.thumb .cv p { align-self: center; font-family: var(--serif); font-size: clamp(0.5rem, 0.9vw, 0.82rem); line-height: 1.15; text-wrap: balance; overflow: hidden; }
.thumb .cv em { font-style: normal; font-size: 0.45rem; letter-spacing: 0.14em; text-transform: uppercase; color: #A3A3A3; border-top: 1px solid #262626; padding-top: 4px; display: flex; justify-content: space-between; }
.thumb.claro { background: var(--post-light); }
.thumb.claro .cv { color: #0A0A0A; }
.thumb.claro .cv small, .thumb.claro .cv em { color: #737373; }
.thumb.claro .cv em { border-top-color: #D6D6D3; }
.thumb.sm .cv small, .thumb.sm .cv em { display: none; }
.thumb.sm .cv p { font-size: 0.42rem; }
.thumb .flag { position: absolute; top: 5px; right: 5px; font-size: 0.5rem; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(5,5,5,0.72); color: #F5F5F3; border-radius: 999px; padding: 1px 6px; }

.week-strip .thumb, .week-strip .thumb.reels, .gallery .thumb, .gallery .thumb.reels { aspect-ratio: 4 / 5; }

/* Calendário */
.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 20px; margin-bottom: 20px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 0.8125rem; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 0.8125rem; color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { color: var(--text); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--surface-2); color: var(--text); border-color: var(--text-2); }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.month .wd { padding: 8px 10px; font-size: 0.6875rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-2); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.day { min-height: 168px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px; display: grid; grid-template-rows: auto 1fr; gap: 6px; min-width: 0; }
.day.out { background: repeating-linear-gradient(135deg, transparent 0 8px, var(--bg-2) 8px 9px); }
.day .dn { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-2); font-variant-numeric: tabular-nums; }
.day .dn b { font-weight: 500; color: var(--text); }
.day.today .dn b { background: var(--inv-bg); color: var(--inv-fg); border-radius: 999px; padding: 0 7px; }
.day button.slot { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; align-items: start; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: inherit; min-width: 0; }
.day button.slot .h { font-family: var(--serif); font-size: 0.8rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.day button.slot .m { font-size: 0.625rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); margin-top: 4px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.day button.slot:hover .h { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.day.dim button.slot { opacity: 0.25; }
.list-week { margin-bottom: 26px; }
.list-week h3 { font-size: var(--s1); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.list-week h3 span { font-family: var(--sans); font-size: 0.75rem; letter-spacing: 0.1em; color: var(--text-2); text-transform: uppercase; }
.row { display: grid; grid-template-columns: 64px 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding-block: 12px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; color: inherit; }
.row:last-child { border-bottom: 1px solid var(--line); }
.row .dd { font-variant-numeric: tabular-nums; display: grid; }
.row .dd b { font-family: var(--serif); font-weight: 400; font-size: 1.3rem; line-height: 1; }
.row .dd span { font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); margin-top: 3px; }
.row .h { display: block; font-family: var(--serif); font-size: 1.02rem; line-height: 1.3; }
.row .m { display: block; font-size: 0.75rem; color: var(--text-2); margin-top: 3px; }
.row:hover .h { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.row.dim { opacity: 0.3; }
@media (max-width: 560px) { .row { grid-template-columns: 52px 40px minmax(0, 1fr); } .row > .st { grid-column: 3; } }

/* Produção (quadro) */
.board { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.col { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.col > header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 2px 6px; }
.col > header b { font-weight: 500; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 8px; }
.col > header span { font-size: 0.75rem; color: var(--text-2); font-variant-numeric: tabular-nums; }
.col > p.hint { font-size: 0.75rem; color: var(--text-2); line-height: 1.4; padding: 0 2px; }

    else if (st === "agendado") { txt = "<b>Agendado</b> para " + quando + "."; btns = '<button class="btn small line" type="button" data-set="publicado">Marcar como publicado</button>'; }
    else { txt = "<b>Publicado.</b> Depois de 48 horas, registre os números abaixo."; }
    return '<div class="action"><p>' + txt + '</p><div id="ajusteBox" hidden><label class="field" for="ajusteTxt">O que mudar?<textarea id="ajusteTxt" placeholder="Ex.: trocar a frase do slide 2, deixar a capa mais clara"></textarea></label><div class="btns" style="margin-top:8px"><button class="btn small primary" type="button" data-ajuste-ok="1">Enviar pedido</button><button class="btn small line" type="button" data-ajuste="0">Cancelar</button></div></div>' + (btns ? '<div class="btns" id="actBtns">' + btns + "</div>" : "") + "</div>";
  }
  function mediaBox(p) {
    if (p.video) {
      return '<div class="media"><div class="stage"><video id="drVideo" src="' + p.video + '" poster="' + p.slides[0] + '" controls playsinline preload="none"></video></div><div class="cap"><span>Reels · 1080×1920 · com trilha</span><a href="' + p.video + '" target="_blank" rel="noopener">Abrir o vídeo em outra aba ↗</a></div></div>';
    }
    if (p.slides && p.slides.length) {
      var many = p.slides.length > 1, i = Math.min(slideI, p.slides.length - 1);
      return '<div class="media"><div class="stage">' + (many ? '<button class="icon-btn arr l" type="button" data-slide="-1" aria-label="Slide anterior"' + (i === 0 ? " disabled" : "") + ">‹</button>" : "") +
        '<img src="' + p.slides[i] + '" alt="' + p.id + " slide " + (i + 1) + '">' +
        (many ? '<button class="icon-btn arr r" type="button" data-slide="1" aria-label="Próximo slide"' + (i === p.slides.length - 1 ? " disabled" : "") + ">›</button>" : "") + "</div>" +
        (many ? '<div class="strip">' + p.slides.map(function (s, k) { return '<button type="button" data-slide-to="' + k + '" aria-current="' + (k === i) + '" aria-label="Slide ' + (k + 1) + '"><img src="' + s + '" alt=""></button>'; }).join("") + "</div>" : "") +
        '<div class="cap"><span>' + (many ? "Slide " + (i + 1) + " de " + p.slides.length : "Imagem única") + " · 1080×1350</span><a href=\"" + p.slides[i] + '" target="_blank" rel="noopener">Abrir em tamanho real ↗</a></div></div>';
    }
    return '<div class="media"><div class="stage">' + thumb(p) + '</div><div class="cap"><span>Capa planejada. A peça final aparece aqui quando ficar pronta.</span></div></div>';
  }
  function renderDrawer() {
    if (!openN) return;
    var p = postBy(openN), st = statusOf(p), dd = Store.doc(p.id) || {}, d = dateOf(p.n), r = dd.resultado || {};
    $("drTitle").textContent = p.id + " de 30";
    document.querySelector('[data-action="prev"]').disabled = openN <= 1;
    document.querySelector('[data-action="next"]').disabled = openN >= 30;
    var steps = '<div class="steps" aria-label="Etapa atual: ' + SN[st].nome + '">' + STATUS.map(function (s) {
      return '<div class="' + (s.i < SN[st].i ? "done" : s.i === SN[st].i ? "cur" : "") + '"><i></i><span>' + s.nome + "</span></div>";
    }).join("") + "</div>";
    steps = '<div style="display:grid;gap:8px"><p class="steps-cap">Etapa ' + (SN[st].i + 1) + " de 6 · <b>" + SN[st].nome + "</b></p>" + steps + "</div>";
    var tags = '<div class="tags"><span class="tag">' + fnSw(p.f) + F[p.f].nome + '</span><span class="tag">' + p.fmt + '</span><span class="tag">' + esc(PIL[p.p]) + "</span>" + (p.estilo ? '<span class="tag">Editorial</span>' : "") + (p.fixado ? '<span class="tag solid">Fixar no perfil</span>' : "") + "</div>";
    var trilha = p.trilha ? '<div class="dr-sec"><h3>Trilha original</h3><div class="audio-row track' + (playing === p.trilha.arquivo ? " on" : "") + '" data-track="' + p.trilha.arquivo + '"><button type="button" class="play" data-play="' + p.trilha.arquivo + '" aria-label="Tocar a trilha">' + (playing === p.trilha.arquivo && !$("player").paused ? ICON_PAUSE : ICON_PLAY) + '</button><div style="min-width:0;flex:1"><div class="m"><b>' + p.trilha.variacao + "</b> · " + esc(p.trilha.tom) + " · " + String(p.trilha.bpm).replace(".", ",") + " BPM · " + esc(p.trilha.acordes) + '</div><div class="bar" data-seek="' + p.trilha.arquivo + '" style="height:2px;background:var(--line);margin-top:8px;position:relative;cursor:pointer"><i style="position:absolute;inset:0 auto 0 0;width:0;background:var(--text)"></i></div></div><span class="tag' + (p.trilha.status === "aprovada" ? " solid" : "") + '">' + (p.trilha.status === "aprovada" ? "Aprovada" : "Rascunho") + "</span></div></div>" : "";
    var stories = p.stories && p.stories.length ? '<div class="dr-sec"><h3>Stories do dia</h3><div class="stories">' + p.stories.map(function (s) {
      return '<a href="' + s.arquivo + '" target="_blank" rel="noopener"><img loading="lazy" src="' + s.arquivo + '" alt="' + esc(s.momento) + '"><span>' + esc(s.momento) + "</span></a>";
    }).join("") + '</div><p class="muted" style="font-size:0.8125rem">1080×1920. A pergunta do story do post já pede resposta na arte; se postar pelo app, dá para pôr o adesivo de enquete no espaço livre abaixo dela.</p></div>' : "";
    var legenda = p.legenda ? '<div class="dr-sec"><h3>Legenda <button class="btn small line" type="button" data-copy-leg="1">Copiar legenda</button></h3><div class="legenda">' + esc(p.legenda) + "</div></div>" : '<div class="dr-sec"><h3>Legenda</h3><p class="empty">A legenda é escrita junto com a peça.</p></div>';
    var plano = '<div class="dr-sec"><h3>Plano</h3><dl class="kv">' +
      [["Objetivo", p.objetivo], ["Tema", p.tema], ["Ângulo", p.angulo], ["Ideia central", p.ideia], ["CTA", p.cta], ["Métrica", p.metrica], ["Fundo", p.fundo], ["Tema recorrente", p.fio]]
        .filter(function (x) { return x[1]; }).map(function (x) { return "<dt>" + x[0] + "</dt><dd>" + esc(x[1]) + "</dd>"; }).join("") + "</dl>" +
      (p.requer ? '<p class="req"><b>Depende de</b>' + esc(p.requer) + "</p>" : "") + "</div>";
    var arquivos = p.pasta ? '<p class="muted" style="font-size:0.8125rem">Arquivos no repositório: <code>' + esc(p.pasta) + "</code></p>" : "";
    var resultado = '<div class="dr-sec"><h3>Resultado</h3>' + (st === "publicado" ? "" : '<p class="muted" style="font-size:0.8125rem">Preencha depois de publicado.</p>') + '<div class="fields">' +
      [["alcance", "Alcance"], ["naoSeg", "% não seguidores"], ["salv", "Salvamentos"], ["envios", "Envios"], ["dms", "Pedidos na DM"]].map(function (f) {
        return '<label class="field" for="r_' + f[0] + '">' + f[1] + '<input type="number" min="0" inputmode="numeric" id="r_' + f[0] + '" data-res="' + f[0] + '" value="' + esc(r[f[0]] == null ? "" : r[f[0]]) + '"></label>';
      }).join("") + "</div></div>";
    var nota = '<div class="dr-sec"><h3>Comentário para o Claude</h3><label class="field" for="notaTxt"><span class="sr">Comentário</span><textarea id="notaTxt" placeholder="Qualquer observação sobre este post">' + esc(dd.nota || "") + "</textarea></label></div>";
    var outras = '<details class="more"><summary>Mudar a etapa manualmente</summary><div class="tags" style="margin-top:10px">' + STATUS.map(function (s) {
      return '<button type="button" class="chip" data-set="' + s.id + '" aria-pressed="' + (s.id === st) + '"><span class="sg ' + s.id + '"></span>' + s.nome + "</button>";
    }).join("") + "</div></details>";
    $("drBody").innerHTML = '<div class="dr-head"><span class="when">' + p.id + " · " + WDL[d.getDay()] + " " + dlabel(d) + (horaPost(p) ? " · " + horaPost(p) : "") + "</span><h2>" + esc(p.hook) + "</h2>" + tags + "</div>" +
      steps + actionBox(p, st, dd) + mediaBox(p) + trilha + stories + legenda + plano + arquivos + resultado + nota + outras;
  }

  /* ---------------- áudio ---------------- */
  var player = $("player");
  function syncPlayers() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-track]"), function (el) {
      var on = el.getAttribute("data-track") === playing;
      el.classList.toggle("on", on);
      var b = el.querySelector(".play"); if (b) b.innerHTML = on && !player.paused ? ICON_PAUSE : ICON_PLAY;
    });
  }
  function play(src) {
    if (playing === src) { if (player.paused) player.play().catch(function () {}); else player.pause(); syncPlayers(); return; }
    playing = src; player.src = src; player.play().catch(function () { toast("Não foi possível tocar o áudio."); }); syncPlayers();
  }
  player.addEventListener("play", syncPlayers); player.addEventListener("pause", syncPlayers);
  player.addEventListener("timeupdate", function () {
    if (!player.duration) return;
    Array.prototype.forEach.call(document.querySelectorAll('[data-seek="' + playing + '"] i'), function (i) { i.style.width = (100 * player.currentTime / player.duration) + "%"; });
  });
  player.addEventListener("ended", function () { syncPlayers(); });

  /* ---------------- eventos ---------------- */
  function approve(id) {
    Store.setPost(id, { status: "aprovado", ajuste: null }, "Aprovou").then(function () { toast(id + " aprovado."); });
  }
  document.addEventListener("click", function (e) {
    var t = e.target;
    var a = t.closest("[data-view]"); if (a) { e.preventDefault(); go(a.getAttribute("data-view")); try { history.replaceState(null, "", "#" + a.getAttribute("data-view")); } catch (x) { /* ignora */ } return; }
    var o = t.closest("[data-open]"); if (o) { e.preventDefault(); openPost(+o.getAttribute("data-open")); return; }
    var ap = t.closest("[data-approve]"); if (ap) { approve(ap.getAttribute("data-approve")); return; }
    var act = t.closest("[data-action]");
    if (act) {
      var w = act.getAttribute("data-action");
      if (w === "close") closePost();
      if (w === "prev") openPost(openN - 1);
      if (w === "next") openPost(openN + 1);
      if (w === "theme") {
        var root = document.documentElement, cur = root.getAttribute("data-theme") || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        root.setAttribute("data-theme", cur === "light" ? "dark" : "light");
        try { localStorage.setItem("solvix-social-os:tema", root.getAttribute("data-theme")); } catch (x) { /* ignora */ }
      }
      return;
    }
    var sl = t.closest("[data-slide]"); if (sl) { slideI = Math.max(0, slideI + +sl.getAttribute("data-slide")); renderDrawer(); return; }
    var st2 = t.closest("[data-slide-to]"); if (st2) { slideI = +st2.getAttribute("data-slide-to"); renderDrawer(); return; }
    var set = t.closest("[data-set]");
    if (set && openN) {
      var p = postBy(openN), s = set.getAttribute("data-set");
      Store.setPost(p.id, { status: s }, s === "publicado" ? "Marcou como publicado" : s === "revisao" ? "Desfez a aprovação" : "Mudou para " + SN[s].nome).then(function () { toast(p.id + ": " + SN[s].nome + "."); });
      return;
    }
    var aj = t.closest("[data-ajuste]");
    if (aj) { var on = aj.getAttribute("data-ajuste") === "1"; $("ajusteBox").hidden = !on; var ab = $("actBtns"); if (ab) ab.hidden = on; if (on) $("ajusteTxt").focus(); return; }
    if (t.closest("[data-ajuste-ok]")) {
      var txt = $("ajusteTxt").value.trim();
      if (!txt) { toast("Escreva o que mudar."); return; }
      var pp = postBy(openN);
      Store.setPost(pp.id, { status: "producao", ajuste: txt }, "Pediu ajuste").then(function () { toast("Pedido de ajuste enviado."); });
      return;
    }
    var cf = t.closest("[data-cf]"); if (cf) { calF = cf.getAttribute("data-cf"); renderCalendario(); return; }
    var cfm = t.closest("[data-cfmt]"); if (cfm) { calFmt = cfm.getAttribute("data-cfmt"); renderCalendario(); return; }
    var cm = t.closest("[data-cal]"); if (cm) { calMode = cm.getAttribute("data-cal"); renderCalendario(); return; }
    var lb = t.closest("[data-lib]"); if (lb) { libTab = lb.getAttribute("data-lib"); renderBiblioteca(); return; }
    var pl = t.closest("[data-play]"); if (pl) { play(pl.getAttribute("data-play")); return; }
    var sk = t.closest("[data-seek]");
    if (sk && sk.getAttribute("data-seek") === playing && player.duration) { var rc = sk.getBoundingClientRect(); player.currentTime = player.duration * (e.clientX - rc.left) / rc.width; return; }
    var cp = t.closest("[data-copy]"); if (cp) { copy(cp.getAttribute("data-copy"), cp); return; }
    var cl = t.closest("[data-copy-legn]"); if (cl) { copy(postBy(+cl.getAttribute("data-copy-legn")).legenda, cl); return; }
    var cr = t.closest("[data-copy-roteiro]"); if (cr) { copy(roteiroNavegador(), cr); return; }
    var ag = t.closest("[data-agendado]"); if (ag) { var aid = ag.getAttribute("data-agendado"); Store.setPost(aid, { status: "agendado" }, "Agendou no Meta Business Suite").then(function () { toast(aid + " marcado como agendado."); }); return; }
    if (t.closest("[data-copy-leg]")) { copy(postBy(openN).legenda, t.closest("[data-copy-leg]")); return; }
  });
  $("scrim").addEventListener("click", closePost);
  document.addEventListener("keydown", function (e) {
    if (!openN) return;
    if (e.key === "Escape") closePost();
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "TEXTAREA" || tag === "INPUT") return;
    if (e.key === "ArrowRight") openPost(openN + 1);
    if (e.key === "ArrowLeft") openPost(openN - 1);
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.matches("[data-pend]")) {
      var map = Object.assign({}, Store.config().pendencias || {}); map[t.getAttribute("data-pend")] = t.checked;
      Store.setConfig({ pendencias: map }); return;
    }
    if (t.id === "cfgInicio" && t.value) { Store.setConfig({ inicio: t.value }).then(function () { toast("Datas do ciclo atualizadas."); }); return; }
    if (t.id === "cfgHora") { Store.setConfig({ horario: t.value }).then(function () { toast(t.value ? "Horário definido: " + t.value + "." : "Horário removido."); }); return; }
    if (t.id === "notaTxt" && openN) { var p = postBy(openN); if ((Store.doc(p.id) || {}).nota !== t.value) Store.setPost(p.id, { nota: t.value }, "Comentou").then(function () { toast("Comentário salvo."); }); return; }
    if (t.matches("[data-res]") && openN) {
      var q = postBy(openN), r = Object.assign({}, (Store.doc(q.id) || {}).resultado || {});
      r[t.getAttribute("data-res")] = t.value === "" ? null : +t.value;
      Store.setPost(q.id, { resultado: r }, "Registrou resultado").then(function () { toast("Resultado salvo."); });
    }
  });

  Store.on(function () {
    renderNav();
    renderView(current);
    var f = document.activeElement;
    var editing = f && $("drawer").contains(f) && (f.tagName === "TEXTAREA" || f.tagName === "INPUT");
    if (openN && !editing && $("ajusteBox") && $("ajusteBox").hidden) renderDrawer();
  });

  try { var tm = localStorage.getItem("solvix-social-os:tema"); if (tm) document.documentElement.setAttribute("data-theme", tm); } catch (e) { /* ignora */ }
  function route() {
    var h = (location.hash || "").slice(1);
    if (/^d\d\d$/.test(h)) { if (!current) go("hoje"); openPost(+h.slice(1)); return; }
    if (openN) closePost();
    go(h || "hoje");
  }
  window.addEventListener("hashchange", route);
  var h = (location.hash || "").slice(1);
  if (/^d\d\d$/.test(h)) { go("hoje"); openPost(+h.slice(1)); }
  else go(h || "hoje");
  Store.init();
})();
</script>
