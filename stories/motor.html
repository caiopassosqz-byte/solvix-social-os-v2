<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Stories · Solvix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Display:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Stories Solvix — 1080×1920, gerados de stories/dados.js (python3 stories/preparar.py).
   Conteúdo entre y=250 e y=1600: acima fica a barra do Instagram, abaixo o campo de resposta.
   Preto como base; o off-white só em detalhes. Abra com ?d=D04 para ver um dia. */
:root { --bg: #050505; --line: #262626; --g5: #737373; --g4: #A3A3A3; --off: #F5F5F3;
  --serif: "Noto Serif Display", Georgia, serif; --sans: "Inter", Arial, sans-serif; --mono: "JetBrains Mono", Menlo, monospace; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #222; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
.story { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: var(--bg); color: var(--off); font-family: var(--sans); isolation: isolate; }
.story::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse 90% 50% at 20% 8%, #1F1F1F 0%, #0B0B0B 55%, #050505 100%); }
.story::after { content: ""; position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 120px 120px; }
.top { position: absolute; left: 96px; right: 96px; top: 250px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 500; line-height: 1; }
.logo img { height: 56px; display: block; }
.logo small { display: block; font-size: 9px; letter-spacing: 0.42em; color: var(--g4); margin-top: 8px; font-weight: 400; }
.meta { font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--g4); }
.box { position: absolute; left: 96px; right: 96px; top: 400px; bottom: 330px; display: flex; flex-direction: column; gap: 40px; }
.eyebrow { font-size: 24px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--g4); font-weight: 500; display: flex; align-items: center; gap: 18px; }
.eyebrow i { display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--off); }
h2 { font-family: var(--serif); font-weight: 300; font-size: 86px; line-height: 1.02; letter-spacing: -0.015em; }
h2 em { font-style: normal; color: var(--g4); }
.txt { font-size: 32px; line-height: 1.42; color: var(--g4); }
.resp { display: inline-flex; align-self: flex-start; align-items: center; gap: 16px; border: 1.5px solid var(--off); border-radius: 999px; padding: 22px 34px; font-size: 30px; }
.resp::before { content: "↩"; font-size: 30px; }
/* manhã */
.capa { position: relative; align-self: flex-start; width: 520px; height: 650px; border-radius: 26px; overflow: hidden; box-shadow: 0 0 0 2px #2C2C2C, 30px 50px 100px rgba(0,0,0,0.6); transform: rotate(-3deg); margin: 10px 0 10px 20px; background: #111; }
.capa img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; }
.capa.txtonly { display: grid; align-content: center; padding: 50px; font-family: var(--serif); font-weight: 300; font-size: 54px; line-height: 1.05; }
.capa .fmt { position: absolute; left: 22px; bottom: 22px; background: var(--off); color: #050505; font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; padding: 10px 18px; border-radius: 999px; }
.novo { position: absolute; right: 96px; top: 520px; width: 330px; display: grid; gap: 14px; font-size: 26px; line-height: 1.35; color: var(--g4); }
.novo b { font-family: var(--serif); font-weight: 300; font-size: 50px; color: var(--off); line-height: 1.05; }
.livre { height: 120px; }
/* tarde */
.code { background: #0D0D0D; border: 1px solid #2A2A2A; border-radius: 22px; padding: 34px 40px; font-family: var(--mono); font-size: 25px; line-height: 1.5; color: #CFCFCB; white-space: pre; overflow: hidden; }
.code .f { font-family: var(--sans); font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--g5); margin-bottom: 16px; display: flex; gap: 10px; align-items: center; }
.code .f i { width: 12px; height: 12px; border-radius: 50%; background: #333; display: inline-block; }
.code s { text-decoration: none; color: var(--g5); }
.code u { text-decoration: none; color: #FFFFFF; }
.onda { height: 560px; display: flex; align-items: center; gap: 5px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 20px 0; }
.onda i { flex: 1; background: var(--off); border-radius: 4px; min-height: 4px; }
.quadros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: 10px 0; }
.quadros img { width: 100%; border-radius: 16px; box-shadow: 0 0 0 1px #2A2A2A; display: block; }
.grade { display: grid; gap: 14px; }
.grade img { width: 100%; border-radius: 10px; box-shadow: 0 0 0 1px #2A2A2A; display: block; }
.painel { border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px #2A2A2A; }
.painel img { width: 100%; display: block; }
/* palavra-chave */
.chave { display: inline-flex; align-self: flex-start; align-items: baseline; gap: 22px; background: var(--off); color: #050505; border-radius: 22px; padding: 28px 40px; font-size: 32px; }
.chave b { font-family: var(--serif); font-weight: 400; font-size: 92px; line-height: 1; letter-spacing: 0.01em; }
.pdf { display: flex; gap: 22px; }
.pdf img { width: 270px; border-radius: 12px; box-shadow: 0 0 0 1px #2A2A2A, 0 30px 60px rgba(0,0,0,0.5); display: block; }
.pdf img:nth-child(2) { transform: translateY(40px); }
.pdf img:nth-child(3) { transform: translateY(80px); }
.video { width: 600px; border: 1px solid #333; border-radius: 22px; padding: 30px; display: grid; gap: 18px; background: #0D0D0D; }
.video .pl { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--off); display: grid; place-items: center; font-size: 34px; }
.video .r { display: grid; grid-template-columns: 50px 1fr; font-size: 28px; padding: 14px 0; border-top: 1px solid #262626; }
.video .r span { font-family: var(--serif); color: var(--g5); }
</style>
</head>
<body>
<div id="out"></div>
<script src="dados.js"></script>
<script>
var Q = new URLSearchParams(location.search).get("d");
function rich(s) { return (s || "").replace(/\[([^\]]+)\]/g, "<em>$1</em>"); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function barra(d) { return '<div class="top"><span class="logo"><img src="../marca/solvix-simbolo.png" alt=""><span>SOLVIX<small>AGENCY</small></span></span><span class="meta">' + d.id + " · " + d.data + "</span></div>"; }
function story(file, html) { var s = document.createElement("section"); s.className = "story"; s.setAttribute("data-file", file); s.innerHTML = html; document.getElementById("out").appendChild(s); }
function codeHtml(b) {
  var lines = b.linhas.map(function (l) {
    var e = esc(l).replace(/(\/\/.*)$/, "<s>$1</s>").replace(/(&quot;|")([^"]*)(")/g, '<u>"$2"</u>');
    return e;
  }).join("\n");
  return '<div class="code"><div class="f"><i></i><i></i><i></i>&nbsp; ' + b.arquivo + "</div>" + lines + "</div>";
}
var PALAVRA = {
  "CHECKLIST": { t: "O checklist completo [de landing page.]", s: "15 itens para revisar antes de ligar o anúncio. Em PDF, de graça.", v: function () { return '<div class="pdf"><img src="assets/checklist-1.jpg"><img src="assets/checklist-2.jpg"><img src="assets/checklist-3.jpg"></div>'; } },
  "PREÇO": { t: "Quanto custa um site, [sem rodeio.]", s: "O guia de investimento da Solvix: a faixa, o que muda o preço e qual site faz sentido para você.", v: function () { return '<div class="pdf"><img src="assets/preco-1.jpg"><img src="assets/preco-2.jpg"><img src="assets/preco-3.jpg"></div>'; } },
  "ANÁLISE": { t: "Uma análise do seu site, [em vídeo.]", s: "Até 5 minutos, com as 3 correções para fazer primeiro. Sem custo e sem compromisso.", v: function () { return '<div class="video"><div class="pl">▶</div><div class="r"><span>01</span>Primeira tela</div><div class="r"><span>02</span>Contato</div><div class="r"><span>03</span>Celular</div></div>'; } }
};
DIAS.filter(function (d) { return !Q || d.id === Q; }).forEach(function (d) {
  var pasta = d.id.toLowerCase() + "/";
  // manhã: post do dia + pergunta
  var capa = d.capa ? '<div class="capa"><img src="' + d.capa + '" alt=""><span class="fmt">' + d.fmt + "</span></div>"
    : '<div class="capa txtonly">' + esc(d.hook) + '<span class="fmt">' + d.fmt + "</span></div>";
  story(pasta + "01-manha.png", barra(d) + '<div class="novo"><b>Post novo no perfil.</b>Toque na foto do perfil para ver.</div>' +
    '<div class="box" style="gap:34px"><p class="eyebrow"><i></i>Hoje no perfil</p>' + capa +
    '<h2 style="font-size:76px;margin-top:20px">' + esc(d.pergunta) + '</h2><div class="livre"></div><p class="resp">' + esc(d.resposta) + "</p></div>");
  // tarde: bastidor real
  var b = d.bastidor, vis = "";
  if (b.tipo === "codigo") vis = codeHtml(b);
  else if (b.tipo === "trilha") vis = '<div class="onda">' + b.onda.map(function (v) { return '<i style="height:' + Math.max(2, Math.round(v * 100)) + '%"></i>'; }).join("") + "</div>";
  else if (b.tipo === "quadros") vis = '<div class="quadros">' + b.imgs.map(function (s) { return '<img src="' + s + '" alt="">'; }).join("") + "</div>";
  else if (b.tipo === "slides") { var n = b.imgs.length, cols = n <= 3 ? n : n <= 6 ? 3 : 4; vis = '<div class="grade" style="grid-template-columns:repeat(' + cols + ',1fr)">' + b.imgs.map(function (s) { return '<img src="' + s + '" alt="">'; }).join("") + "</div>"; }
  else vis = '<div class="painel"><img src="' + b.img + '" alt=""></div>';
  story(pasta + "02-tarde.png", barra(d) + '<div class="box" style="justify-content:center"><p class="eyebrow"><i></i>Bastidor</p><h2>' + rich(b.titulo) + "</h2>" + vis + '<p class="txt">' + esc(b.texto) + "</p></div>");
  // palavra-chave
  if (d.palavra) {
    var P = PALAVRA[d.palavra];
    story(pasta + "03-palavra.png", barra(d) + '<div class="box" style="gap:44px"><p class="eyebrow"><i></i>Material gratuito</p><h2>' + rich(P.t) + '</h2><p class="txt" style="max-width:26ch">' + P.s + "</p>" + P.v() +
      '<div style="flex:1"></div><p class="chave">Envie <b>' + d.palavra + "</b> na DM</p></div>");
  }
});
window.PRONTO = true;
</script>
</body>
</html>
